# ─────────────────────────────────────────────
# ALERTAS — Limiares de 80% CPU/RAM, Nginx & URLs
# ─────────────────────────────────────────────

# CPU do servidor > 80%
alarm: cpu_usage_high
    on: system.cpu
    lookup: average -1m unaligned of user,system,softirq,irq,guest
    units: %
    every: 10s
    warn: $this > 80
    crit: $this > 90
    info: Uso de CPU do servidor ultrapassou 80%
    to: sysadmin

# RAM do servidor > 80%
alarm: ram_usage_high
    on: system.ram
    lookup: average -10s unaligned of used
    units: MiB
    every: 10s
    warn: ($this / ($system.ram.used + $system.ram.free + $system.ram.cached + $system.ram.buffers)) * 100 > 80
    crit: ($this / ($system.ram.used + $system.ram.free + $system.ram.cached + $system.ram.buffers)) * 100 > 90
    info: Uso de RAM do servidor ultrapassou 80%
    to: sysadmin

# Disco > 80% de uso
alarm: disk_usage_high
    on: disk.space
    lookup: average -1m unaligned of used
    units: %
    every: 1m
    warn: $this > 80
    crit: $this > 90
    info: Uso de disco está elevado (> 80%)
    to: sysadmin

# ─────────────────────────────────────────────
# ALERTAS DE DISPONIBILIDADE DE URLs (HTTP CHECK)
# ─────────────────────────────────────────────
alarm: httpcheck_web_service_down
    on: httpcheck.status
    lookup: average -10s unaligned of success
    units: %
    every: 10s
    warn: $this < 100
    crit: $this == 0
    info: Alerta de indisponibilidade em URL monitorada (retorno diferente de 200 OK ou timeout)
    to: sysadmin
